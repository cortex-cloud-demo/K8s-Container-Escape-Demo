      name: "Build Investigation Code-to-Cloud Card"
      description: |-
        Run CodeToCloudPivot to generate the unified "Investigation Code-to-Cloud"
        markdown card AND to capture the Dockerfile source for the AI task.

          Runtime Triage Results (from K8sEscape.* context):
            container ID, namespace, cluster, node FQDN, process name + SHA256,
            severity and attack details surfaced by the previous task.

          Channel A (Image -> Source via OCI labels):
            registry, CVEs, source repo, build commit, Dockerfile, Code Security.

          Dockerfile capture (fetch_dockerfile=true):
            K8sPivot.DockerfileContent   - raw source, clean
            K8sPivot.DockerfileNumbered  - source with line numbers, this is
                                           what the AI task consumes so it can
                                           cite the exact vulnerable instruction
            K8sPivot.DockerfileFetchStatus - 'fetched@<ref>' or the failure reason

        The fetch is non-fatal: if GitHub is unreachable or the repo is private
        without a token, the card still renders and the AI task simply has no
        code to reason on.
