      node_ips:
        simple: ${K8sEscape.NodeIPs}
      process_name:
        simple: ${K8sEscape.ProcessName}
      process_sha256:
        simple: ${K8sEscape.ProcessImageSHA256}
      process_path:
        simple: ${K8sEscape.ProcessImagePath}
      process_command_line:
        simple: ${K8sEscape.ProcessCommandLine}
      username:
        simple: ${K8sEscape.Username}
      severity:
        simple: ${K8sEscape.Severity}
      details:
