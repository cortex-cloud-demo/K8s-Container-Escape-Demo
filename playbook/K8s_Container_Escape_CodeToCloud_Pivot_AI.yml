inputs:
  - key: RepoURL
    value:
      simple: "https://github.com/cortex-cloud-demo/K8s-Container-Escape-Demo"
    required: false
    description: "Source code repo URL for the image (Channel A). Default: demo repo. Override if pivoting on a different image."
    playbookInputQuery: null
  - key: CommitSHA
    value:
      simple: "main"
    required: false
    description: "Git commit SHA that built the image (Channel A). Default: 'main' branch. Use a specific SHA so the AI reasons on the Dockerfile that actually produced the running image."
    playbookInputQuery: null
  - key: DockerfilePath
    value:
      simple: "Dockerfile"
    required: false
    description: "Path to the Dockerfile in the repo (Channel A). Default: Dockerfile"
    playbookInputQuery: null
  - key: FetchDockerfile
    value:
      simple: "true"
    required: false
    description: "Fetch the raw Dockerfile at the build commit so the AI task can reason on the real code. Set to false to run the playbook without the AI channel."
    playbookInputQuery: null
  - key: GitHubToken
    value:
      simple: ""
    required: false
    description: "Optional GitHub PAT. Only needed if the source repo is private - raw.githubusercontent.com returns 404 without it."
    playbookInputQuery: null
  - key: CortexTenantURL
    value:
      simple: ""
    required: false
    description: "OPTIONAL override for the Cortex tenant base URL used in deep links. Leave EMPTY to auto-detect via demisto.demistoUrls() (recommended)."
    playbookInputQuery: null
  - key: IssueFieldName
    value:
      simple: ""
    required: false
    description: "Optional custom incident field to persist the markdown card (e.g. 'k8scodecloudpivot'). Leave EMPTY (default) if the field doesn't exist - the card is always visible in the task output."
    playbookInputQuery: null
inputSections:
  - inputs:
      - RepoURL
      - CommitSHA
      - DockerfilePath
    name: Channel A - Image -> Source (OCI labels)
    description: Repo / commit / Dockerfile path for the image channel.
  - inputs:
      - FetchDockerfile
      - GitHubToken
    name: AI - Source code capture
    description: Controls the raw Dockerfile fetch that feeds the AI root-cause task.
  - inputs:
      - CortexTenantURL
      - IssueFieldName
    name: Cortex Console
    description: Tenant URL for deep links + optional custom incident field for persistent card storage.
outputSections:
  - outputs:
      - K8sPivot.MarkdownCard
      - K8sPivot.RegistryURL
      - K8sPivot.CWPFindingsURL
      - K8sPivot.RepoURL
      - K8sPivot.CommitURL
      - K8sPivot.DockerfileURL
      - K8sPivot.CodeSecurityURL
    name: Unified Card + Pivots
    description: The investigation card and every deep link from runtime to code.
  - outputs:
