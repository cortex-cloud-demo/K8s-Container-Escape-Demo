version: -1
name: K8s Container Escape - Code-to-Cloud Pivot (AI)
description: |-
  AI variant of "K8s Container Escape - Code-to-Cloud Pivot".

  Same enrichment as the baseline playbook (triage IOCs -> unified
  "Investigation Code-to-Cloud" card), plus:

    * CodeToCloudPivot now also fetches the RAW DOCKERFILE at the build
      commit into K8sPivot.DockerfileContent / K8sPivot.DockerfileNumbered.
      AI prompt tasks have no internet access, so the code has to be handed
      to the model in context.

    * An AI prompt task ("AIRootCauseAndDevFix") reads the investigation
      card + the numbered Dockerfile and returns STRUCTURED JSON:
        verdict, severity, executive_summary, attack_chain (MITRE ATT&CK),
        root_cause_in_code (exact vulnerable instruction + line number),
        fixed_dockerfile (ready to commit), soc_actions, dev_actions,
        blast_radius
      written to context path K8sPivot.AI

    * A conditional task branches on K8sPivot.AI.verdict, and the
      true_positive branch pushes the AI severity onto the issue.

  ---------------------------------------------------------------------
  MANUAL STEP - the AI task is NOT in this file
  ---------------------------------------------------------------------
  The YAML serialization of AI prompt tasks is not published by Palo Alto,
  so shipping a guessed node here would break the import. Instead this
  playbook imports cleanly with a deliberate gap between task #2 (Build
  Investigation Code-to-Cloud Card) and task #3 (AI Verdict?).

  After importing:
    1. Task Library -> AI Prompts -> System tab -> "Local AI Prompt"
    2. Drop it ON THE WIRE between task #2 and task #3
    3. Paste the prompt / inputs / JSON schema from
       playbook/AI_TASK_RootCauseDevFix.md
    4. Advanced -> Execution timeout: 300 (the 10s default WILL 504)
    5. Outputs -> Context path: K8sPivot.AI
    6. Save Playbook

  Until the AI task is added, task #3 sees an empty verdict and takes the
  default branch - the playbook still runs and still builds the card.
