  "3":
    id: "3"
    taskid: 44444444-4444-4444-8444-d4d4d4d4d4d4
    type: condition
    task:
      id: 44444444-4444-4444-8444-d4d4d4d4d4d4
      version: -1
      name: "AI Verdict?"
      description: |-
        >>> DROP THE AI PROMPT TASK ON THE WIRE ABOVE THIS TASK <<<

        Task Library -> AI Prompts -> "Local AI Prompt", dropped between task #2
        and this one. Configuration (prompt, extracted inputs, JSON schema,
        300s timeout, context path K8sPivot.AI) is in
        playbook/AI_TASK_RootCauseDevFix.md.

        Branches on the model's structured verdict:
          - true_positive -> push the AI severity onto the issue
          - anything else (or no AI task yet) -> analyst review

        The AI task cannot branch on its own - per Palo Alto docs an AI prompt
        task only reasons, it takes no action and creates no logic. This
        conditional task is what turns its JSON into a decision.
      iscommand: false
      brand: ""
      script: ""
      playbooktaskmissingcomponent: null
      istaskmissingcomponenterrordismissed: false
