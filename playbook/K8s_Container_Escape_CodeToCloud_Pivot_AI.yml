      - K8sPivot.DockerfileNumbered
      - K8sPivot.DockerfileFetchStatus
    name: Source Code Capture
    description: Dockerfile source handed to the AI task (AI prompt tasks have no internet access).
  - outputs:
      - K8sPivot.AI.verdict
      - K8sPivot.AI.severity
      - K8sPivot.AI.confidence
      - K8sPivot.AI.executive_summary
      - K8sPivot.AI.attack_chain
      - K8sPivot.AI.root_cause_in_code
      - K8sPivot.AI.fixed_dockerfile
      - K8sPivot.AI.soc_actions
      - K8sPivot.AI.dev_actions
      - K8sPivot.AI.blast_radius
    name: AI Root Cause & Dev Fix
    description: Structured output of the AI prompt task (context path K8sPivot.AI).
