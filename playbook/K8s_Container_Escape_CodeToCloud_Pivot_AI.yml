  - contextPath: K8sPivot.AI.severity
    description: AI severity assessment - Critical / High / Medium / Low
  - contextPath: K8sPivot.AI.confidence
    description: AI confidence 0-100
  - contextPath: K8sPivot.AI.executive_summary
    description: One-paragraph summary of the escape for the incident commander
  - contextPath: K8sPivot.AI.attack_chain
    description: Ordered kill chain steps, each mapped to a MITRE ATT&CK technique
  - contextPath: K8sPivot.AI.root_cause_in_code
    description: The Dockerfile instructions responsible, with line numbers
  - contextPath: K8sPivot.AI.fixed_dockerfile
    description: Corrected Dockerfile, ready to commit
  - contextPath: K8sPivot.AI.soc_actions
    description: Immediate containment actions for the SOC
  - contextPath: K8sPivot.AI.dev_actions
    description: Shift-left actions for the development team
  - contextPath: K8sPivot.AI.blast_radius
    description: What the attacker can reach from the compromised node
