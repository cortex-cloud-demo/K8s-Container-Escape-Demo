      description: |-
        The unified "Investigation Code-to-Cloud" card is now visible in
        the previous task's output (and persisted to 'k8scodecloudpivot'
        if the IssueFieldName input was set). The analyst sees the triage
        results inline and can click any deep link to pivot to the right
        surface: Cortex Cloud Registry, CWP findings, GitHub source repo,
        build commit, Dockerfile, or repo Code Security findings.
      type: title
