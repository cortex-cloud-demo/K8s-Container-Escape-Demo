        deep links to the image (Cortex Cloud Asset Inventory), the active
        CVEs (CWP findings), the source repo on GitHub, the build commit,
        the Dockerfile at the commit, and the repo's Code Security findings.

        The card is always returned via HumanReadable (visible in this task's
        output entries below). Optionally persisted to a custom incident
        field via the 'IssueFieldName' playbook input - skipped by default.

        Tenant URL is auto-detected via the Cortex SDK (demisto.demistoUrls).
        The 'CortexTenantURL' input is only needed to override the auto-detection.
