id: a1b2c3d4-5678-4901-bc23-456789abcdef
version: -1
name: K8s Container Escape - Code-to-Cloud Pivot
description: |-
  Enrichment playbook that adds the unified "Investigation Code-to-Cloud"
  card to the issue. The card contains:

    Triage Results (from ExtractK8sContainerEscapeIOCs):
      Container ID, Namespace, Cluster, Node FQDN, Process, SHA256,
      Severity, attack details - the runtime context of the escape.

    Channel A (Image -> Source via OCI labels):
      1. The image in the Cortex Cloud Asset Inventory
      2. The image's CWP findings (active CVEs)
      3. The source repository on GitHub
      4. The build commit on GitHub
      5. The Dockerfile at that commit
      6. The repository's Code Security findings in Cortex Cloud

  Channel A mapping uses OCI standard labels baked into the image:
    org.opencontainers.image.source    -> repo URL
    org.opencontainers.image.revision  -> commit SHA
    com.cortex.demo.dockerfile_path    -> path to Dockerfile

  Two tasks: Triage (extract IOCs into K8sEscape.*) -> Pivot (build the
  unified card from K8sEscape.* + OCI labels).
