inputs:
  - key: RepoURL
    value:
      simple: "https://github.com/cortex-cloud-demo/K8s-Container-Escape-Demo"
    required: false
    description: "Source code repo URL. Default: demo repo. Override if pivoting on a different image."
    playbookInputQuery: null
  - key: CommitSHA
    value:
      simple: "main"
    required: false
    description: "Git commit SHA that built the image. Default: 'main' branch. Use a specific SHA for accurate Dockerfile linking."
    playbookInputQuery: null
  - key: DockerfilePath
    value:
      simple: "Dockerfile"
    required: false
    description: "Path to the Dockerfile in the repo (default: Dockerfile)"
    playbookInputQuery: null
  - key: CortexTenantURL
    value:
      simple: ""
    required: false
    description: "OPTIONAL override for the Cortex tenant base URL used in deep links. Leave EMPTY to auto-detect via demisto.demistoUrls() (recommended). Only set this if you want to point links at a different console (e.g. https://france-xsiam.xdr.eu.paloaltonetworks.com)."
    playbookInputQuery: null
  - key: IssueFieldName
    value:
      simple: ""
    required: false
    description: "Optional custom incident field to persist the markdown card (e.g. 'k8scodecloudpivot'). Leave EMPTY (default) if the field doesn't exist in your tenant - the card is always visible in the task output. Create the field once in Settings -> Object Setup -> Incident Fields if you want persistent storage on the issue."
    playbookInputQuery: null
inputSections:
  - inputs:
      - RepoURL
      - CommitSHA
      - DockerfilePath
    name: Source Code Mapping
    description: Repo / commit / Dockerfile path used to build the pivot card.
  - inputs:
      - CortexTenantURL
      - IssueFieldName
    name: Cortex Console
    description: Tenant URL for deep links + optional custom incident field for persistent card storage.
outputSections:
  - outputs:
      - K8sPivot.RegistryURL
      - K8sPivot.CWPFindingsURL
      - K8sPivot.RepoURL
      - K8sPivot.CommitURL
      - K8sPivot.DockerfileURL
      - K8sPivot.CodeSecurityURL
    name: Pivot Links
    description: 6 deep links from the runtime issue to image / code surfaces.
outputs:
  - contextPath: K8sPivot.RegistryURL
    description: Deep link to the image in Cortex Cloud Registry view
  - contextPath: K8sPivot.CWPFindingsURL
    description: Deep link to active CVEs on this image (CWP findings)
  - contextPath: K8sPivot.RepoURL
    description: GitHub source repository URL
  - contextPath: K8sPivot.CommitURL
    description: Deep link to the build commit on GitHub
  - contextPath: K8sPivot.DockerfileURL
    description: Deep link to the Dockerfile at the build commit on GitHub
  - contextPath: K8sPivot.CodeSecurityURL
    description: Deep link to repo Code Security findings in Cortex Cloud
