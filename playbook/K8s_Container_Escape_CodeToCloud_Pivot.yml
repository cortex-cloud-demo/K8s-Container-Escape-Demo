      username:
        simple: ${K8sEscape.Username}
      severity:
        simple: ${K8sEscape.Severity}
      details:
        simple: ${K8sEscape.Details}
      is_spring_shell:
        simple: ${K8sEscape.IsSpringShell}
      is_webshell:
        simple: ${K8sEscape.IsWebshell}
      is_privileged_user:
        simple: ${K8sEscape.IsPrivilegedUser}
      is_container_runtime:
        simple: ${K8sEscape.IsContainerRuntime}
      cortex_tenant_url:
