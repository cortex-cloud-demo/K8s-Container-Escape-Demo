id: a1b2c3d4-5678-4901-bc23-456789abcdef
version: -1
name: K8s Container Escape - Code-to-Cloud Pivot
description: |-
  Lightweight enrichment playbook that adds a Code-to-Cloud pivot card
  to the issue. The card contains clickable deep links from the runtime
  SOC alert to:
    1. The image in the Cortex Cloud Registry view
    2. The image's CWP findings (active CVEs)
    3. The source repository on GitHub
    4. The exact build commit on GitHub
    5. The Dockerfile at that commit
    6. The repository's Code Security findings in Cortex Cloud

  Mapping image -> source uses OCI standard labels baked into the image:
    org.opencontainers.image.source    -> repo URL
    org.opencontainers.image.revision  -> commit SHA
    com.cortex.demo.dockerfile_path    -> path to Dockerfile

  Two tasks: Triage (extract image identity) -> Pivot (build the card).
  No rescans, no API calls beyond the LLM-free deep link generation.
