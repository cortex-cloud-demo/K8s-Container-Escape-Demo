inputs:
  - key: RepoURL
    value:
      simple: "https://github.com/cortex-cloud-demo/K8s-Container-Escape-Demo"
    required: false
    description: "Source code repo URL for the image (Channel A). Default: demo repo. Override if pivoting on a different image."
    playbookInputQuery: null
  - key: CommitSHA
    value:
      simple: "main"
    required: false
    description: "Git commit SHA that built the image (Channel A). Default: 'main' branch. Use a specific SHA for accurate Dockerfile linking."
    playbookInputQuery: null
  - key: DockerfilePath
    value:
      simple: "Dockerfile"
    required: false
    description: "Path to the Dockerfile in the repo (Channel A). Default: Dockerfile"
    playbookInputQuery: null
  - key: CortexTenantURL
    value:
      simple: ""
    required: false
    description: "OPTIONAL override for the Cortex tenant base URL used in deep links. Leave EMPTY to auto-detect via demisto.demistoUrls() (recommended)."
    playbookInputQuery: null
  - key: IssueFieldName
    value:
      simple: ""
    required: false
    description: "Optional custom incident field to persist the markdown card (e.g. 'k8scodecloudpivot'). Leave EMPTY (default) if the field doesn't exist - the card is always visible in the task output."
    playbookInputQuery: null
inputSections:
  - inputs:
      - RepoURL
      - CommitSHA
      - DockerfilePath
    name: Channel A - Image -> Source (OCI labels)
    description: Repo / commit / Dockerfile path for the image channel.
  - inputs:
      - CortexTenantURL
      - IssueFieldName
    name: Cortex Console
    description: Tenant URL for deep links + optional custom incident field for persistent card storage.
outputSections:
  - outputs:
      - K8sPivot.Triage.ContainerID
      - K8sPivot.Triage.ContainerImageID
      - K8sPivot.Triage.Namespace
      - K8sPivot.Triage.ClusterName
      - K8sPivot.Triage.NodeFQDN
      - K8sPivot.Triage.NodeIPs
      - K8sPivot.Triage.ProcessName
      - K8sPivot.Triage.ProcessImageSHA256
      - K8sPivot.Triage.Username
      - K8sPivot.Triage.Severity
      - K8sPivot.Triage.Details
      - K8sPivot.Triage.IsSpringShell
      - K8sPivot.Triage.IsWebshell
      - K8sPivot.Triage.IsPrivilegedUser
    name: Runtime Triage
    description: Triage IOCs surfaced by ExtractK8sContainerEscapeIOCs (task #1) and embedded in the card.
  - outputs:
      - K8sPivot.RegistryURL
      - K8sPivot.CWPFindingsURL
      - K8sPivot.RepoURL
      - K8sPivot.CommitURL
      - K8sPivot.DockerfileURL
      - K8sPivot.CodeSecurityURL
    name: Channel A - Image Pivots
    description: Deep links from the runtime issue to image / source code surfaces.
  - outputs:
      - K8sPivot.MarkdownCard
      - K8sPivot.HasImageChannel
      - K8sPivot.HasTriage
    name: Unified Card
    description: Full markdown card + section availability flags.
outputs:
  - contextPath: K8sPivot.Triage.ContainerID
    description: Container ID (short form) where the escape originated
  - contextPath: K8sPivot.Triage.ContainerImageID
    description: SHA256 of the running container image
  - contextPath: K8sPivot.Triage.Namespace
    description: Kubernetes namespace of the compromised pod
  - contextPath: K8sPivot.Triage.ClusterName
    description: Cluster name hosting the compromised pod
  - contextPath: K8sPivot.Triage.NodeFQDN
    description: FQDN of the worker node where the escape was observed
  - contextPath: K8sPivot.Triage.NodeIPs
    description: List of IP addresses of the worker node
  - contextPath: K8sPivot.Triage.ProcessName
    description: Name of the malicious / suspicious process
  - contextPath: K8sPivot.Triage.ProcessImageSHA256
    description: SHA256 of the malicious / suspicious process image
  - contextPath: K8sPivot.Triage.Username
    description: Source user that ran the malicious process
  - contextPath: K8sPivot.Triage.Severity
    description: Severity surfaced by ExtractK8sContainerEscapeIOCs
  - contextPath: K8sPivot.Triage.Details
    description: Free-form attack details from the issue
  - contextPath: K8sPivot.Triage.IsSpringShell
    description: True if Spring4Shell indicators were matched in details
  - contextPath: K8sPivot.Triage.IsWebshell
    description: True if webshell indicators were matched in details
  - contextPath: K8sPivot.Triage.IsPrivilegedUser
    description: True if the source user is root / privileged
  - contextPath: K8sPivot.RegistryURL
    description: Deep link to the image in Cortex Cloud Registry view
  - contextPath: K8sPivot.CWPFindingsURL
    description: Deep link to active CVEs on this image (CWP findings)
  - contextPath: K8sPivot.RepoURL
    description: GitHub source repository URL
  - contextPath: K8sPivot.CommitURL
    description: Deep link to the build commit on GitHub
  - contextPath: K8sPivot.DockerfileURL
    description: Deep link to the Dockerfile at the build commit on GitHub
  - contextPath: K8sPivot.CodeSecurityURL
    description: Deep link to repo Code Security findings in Cortex Cloud
  - contextPath: K8sPivot.MarkdownCard
    description: Full unified "Investigation Code-to-Cloud" markdown card
  - contextPath: K8sPivot.HasImageChannel
    description: Boolean - whether Channel A (image) was populated
  - contextPath: K8sPivot.HasTriage
    description: Boolean - whether the runtime triage section was populated
