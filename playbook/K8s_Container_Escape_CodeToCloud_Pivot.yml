    task:
      id: 33333333-3333-4333-8333-cccccccccccc
      version: -1
      name: "Build Investigation Code-to-Cloud Card"
      description: |-
        Run CodeToCloudPivot to generate the unified "Investigation Code-to-Cloud"
        markdown card. The card contains:

          Runtime Triage Results (from K8sEscape.* context):
            container ID, namespace, cluster, node FQDN, process name + SHA256,
            severity and attack details surfaced by the previous task.

          Channel A (Image -> Source via OCI labels):
            registry, CVEs, source repo, build commit, Dockerfile, Code Security.

        Triage values come from K8sEscape.* populated by the previous
        ExtractK8sContainerEscapeIOCs task (task #1). Image identity comes from
        K8sEscape.ContainerImageID + incident.image_name; repo URL, commit SHA
        and Dockerfile path come from the playbook inputs.

        Always returned via HumanReadable. Optionally persisted to a custom
        incident field via the 'IssueFieldName' input.

        Tenant URL is auto-detected via the Cortex SDK (demisto.demistoUrls).
      iscommand: true
      brand: ""
      script: CodeToCloudPivot
